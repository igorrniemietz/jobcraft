<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#7A6FE0"/>
      <stop offset="55%" stop-color="#5B4FB3"/>
      <stop offset="100%" stop-color="#3F348A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE26B"/>
      <stop offset="100%" stop-color="#F2B705"/>
    </linearGradient>
    <linearGradient id="wm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D7D2EE"/>
    </linearGradient>
  </defs>

  <!-- Mascote: cartucho SNES pixel-art -->
  <g transform="translate(4 6)" shape-rendering="crispEdges">
    <!-- corpo -->
    <rect x="0"  y="0"  width="52" height="50" fill="url(#g)" rx="3"/>
    <rect x="0"  y="0"  width="52" height="5"  fill="#7A6FE0"/>
    <rect x="0"  y="45" width="52" height="5"  fill="#3F348A"/>
    <rect x="0"  y="0"  width="3"  height="50" fill="#7A6FE0"/>
    <rect x="49" y="0"  width="3"  height="50" fill="#3F348A"/>
    <!-- tela -->
    <rect x="8" y="9"  width="36" height="20" fill="#1F1B25"/>
    <rect x="10" y="11" width="32" height="16" fill="#B8B5E1"/>
    <!-- J pixel grande na tela -->
    <g fill="#1F1B25">
      <rect x="22" y="13" width="16" height="3"/>
      <rect x="30" y="16" width="3"  height="7"/>
      <rect x="20" y="20" width="3"  height="3"/>
      <rect x="23" y="22" width="3"  height="1"/>
    </g>
    <!-- conector dourado -->
    <rect x="8"  y="34" width="36" height="7" fill="url(#gold)"/>
    <rect x="8"  y="34" width="36" height="2" fill="#FFE26B"/>
    <g fill="#1F1B25">
      <rect x="12" y="37" width="2" height="2"/>
      <rect x="16" y="37" width="2" height="2"/>
      <rect x="20" y="37" width="2" height="2"/>
      <rect x="24" y="37" width="2" height="2"/>
      <rect x="28" y="37" width="2" height="2"/>
      <rect x="32" y="37" width="2" height="2"/>
      <rect x="36" y="37" width="2" height="2"/>
      <rect x="40" y="37" width="2" height="2"/>
    </g>
  </g>

  <!-- Estrela XP -->
  <g transform="translate(54 4)" fill="url(#gold)" shape-rendering="crispEdges">
    <rect x="4" y="0" width="2" height="2"/>
    <rect x="2" y="2" width="6" height="2"/>
    <rect x="0" y="4" width="10" height="2"/>
    <rect x="2" y="6" width="6" height="2"/>
    <rect x="4" y="8" width="2" height="2"/>
  </g>

  <!-- Wordmark JOBCRAFT (legível, Inter 800) -->
  <text x="68" y="40"
        font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"
        font-weight="800"
        font-size="30"
        letter-spacing="0.5"
        fill="url(#wm)">JOB<tspan fill="#FACC15">CRAFT</tspan></text>

  <!-- Linha pixel dourada decorativa -->
  <g transform="translate(68 48)" shape-rendering="crispEdges">
    <rect x="0"   y="0" width="8" height="3" fill="#FACC15"/>
    <rect x="10"  y="0" width="8" height="3" fill="#FACC15"/>
    <rect x="20"  y="0" width="8" height="3" fill="#FACC15"/>
    <rect x="30"  y="0" width="8" height="3" fill="#7A6FE0"/>
    <rect x="40"  y="0" width="8" height="3" fill="#7A6FE0"/>
    <rect x="50"  y="0" width="8" height="3" fill="#7A6FE0"/>
    <rect x="60"  y="0" width="8" height="3" fill="#3F348A"/>
    <rect x="70"  y="0" width="8" height="3" fill="#3F348A"/>
  </g>

  <!-- Subtítulo opcional -->
  <text x="68" y="60"
        font-family="Inter, 'Segoe UI', system-ui, sans-serif"
        font-weight="600"
        font-size="8"
        letter-spacing="2.4"
        fill="#B8B5E1">CARREIRA · GAMEPLAY</text>
</svg>
