version: "3.9"

# Acesso: https://localhost
# Porta 8080 interna — nunca exposta diretamente

networks:
  internal:
    name: jobcraft_internal
    driver: bridge

services:
  traefik:
    image: traefik:v3.1
    container_name: jobcraft_traefik
    ports:
      - "443:443"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - internal
    restart: unless-stopped

  jobcraft:
    build: .
    container_name: jobcraft_app
    ports:
      - "3000:8080"
    environment:
      # Desative qualquer fonte com =false a qualquer momento e reinicie
      GUPY_ENABLED:     "${GUPY_ENABLED:-false}"
      REMOTIVE_ENABLED: "${REMOTIVE_ENABLED:-false}"
      ADZUNA_ENABLED:   "${ADZUNA_ENABLED:-false}"
      VAGAS_ENABLED:    "${VAGAS_ENABLED:-true}"
      INDEED_ENABLED:   "${INDEED_ENABLED:-true}"
      CATHO_ENABLED:    "${CATHO_ENABLED:-true}"
      TRAMPOS_ENABLED:  "${TRAMPOS_ENABLED:-true}"
      SYNC_INTERVAL_MS: "${SYNC_INTERVAL_MS:-21600000}"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jobcraft.rule=Host(`localhost`)"
      - "traefik.http.routers.jobcraft.entrypoints=websecure"
      - "traefik.http.routers.jobcraft.tls=true"
      - "traefik.http.services.jobcraft.loadbalancer.server.port=8080"
    networks:
      - internal
    restart: unless-stopped
