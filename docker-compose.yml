version: "3.9"

# Produção — acesso via https://localhost (Traefik)
# Uso: docker compose up -d
# ou:  npm run docker:prod

networks:
  internal:
    name: jobcraft_internal
    driver: bridge

services:
  traefik:
    image: traefik:v3.1
    container_name: jobcraft_traefik
    ports:
      - "443:443"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - internal
    restart: unless-stopped

  jobcraft:
    build: .
    container_name: jobcraft_app
    environment:
      NODE_ENV: production
      PORT: 8080
      DATA_PATH: "/app/data"
      YOUTUBE_API_KEY:    "${YOUTUBE_API_KEY:-}"
      SYNC_INTERVAL_MS:   "${SYNC_INTERVAL_MS:-21600000}"
      VAGAS_ENABLED:      "${VAGAS_ENABLED:-true}"
      GREENHOUSE_ENABLED: "${GREENHOUSE_ENABLED:-true}"
      LEVER_ENABLED:      "${LEVER_ENABLED:-true}"
      REMOTAR_ENABLED:    "${REMOTAR_ENABLED:-true}"
      GUPY_ENABLED:       "${GUPY_ENABLED:-false}"
      REMOTIVE_ENABLED:   "${REMOTIVE_ENABLED:-false}"
      ADZUNA_ENABLED:     "${ADZUNA_ENABLED:-false}"
      # Banco de dados (deixar vazio = usa arquivo local em /app/data)
      DATABASE_URL:       "${DATABASE_URL:-}"
    volumes:
      - ./data:/app/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jobcraft.rule=Host(`localhost`)"
      - "traefik.http.routers.jobcraft.entrypoints=websecure"
      - "traefik.http.routers.jobcraft.tls=true"
      - "traefik.http.services.jobcraft.loadbalancer.server.port=8080"
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

